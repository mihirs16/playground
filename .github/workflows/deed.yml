name: deed

on:
  pull_request:
    paths:
      - "deed/**"
      - ".github/workflows/deed.yml"
  push:
    branches: [main]
    paths:
      - "deed/**"
      - ".github/workflows/deed.yml"

# fmt and validate need no AWS credentials. plan is deliberately kept local
# (`just deed-plan`) under short-lived SSO creds — CI never touches the backend.
jobs:
  deed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ">= 1.10"

      - name: fmt
        run: terraform -chdir=deed fmt -check -recursive

      - name: validate
        run: |
          for dir in deed/*/; do
            echo "== validate ${dir} =="
            terraform -chdir="${dir}" init -backend=false -input=false
            terraform -chdir="${dir}" validate
          done
