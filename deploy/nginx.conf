# custodian's origin reverse-proxy. TLS terminates at CloudFront; this hop is
# plain HTTP (deed.md:244-245). nginx's only jobs here are to forward to
# custodian and to apply per-location rate limits (custodian.md story 10). It is
# not an internet-facing server: the box's security group admits only the
# CloudFront origin-facing prefix list, so every request already came through the
# edge.

events {}

http {
    # The real client sits behind CloudFront, so $remote_addr is a CloudFront
    # edge, not the caller. CloudFront appends the viewer's IP to the END of
    # X-Forwarded-For, so the last hop is the one value CloudFront attests: a
    # client can prepend anything it likes, but that spoofed text sits to the left
    # of the appended IP and is never the last hop. Keying on the first hop would
    # let a caller send a unique X-Forwarded-For per request and never trip the
    # limit; the last hop is per-viewer and unspoofable here. Falls back to
    # $remote_addr when the header is absent (a direct origin call, which the
    # security group blocks anyway).
    map $http_x_forwarded_for $client_ip {
        default                    $remote_addr;
        "~(?<last>[^\s,]+)\s*$"    $last;
    }

    # Two zones: a looser public budget and a tighter one for the admin surface,
    # which is authed and write-heavy. burst/nodelay live on the locations.
    limit_req_zone $client_ip zone=public:10m rate=20r/s;
    limit_req_zone $client_ip zone=admin:10m rate=5r/s;

    # 429, not nginx's default 503, when a caller outruns its budget.
    limit_req_status 429;

    server {
        listen 80;
        listen [::]:80;

        # Resolve the custodian service through Docker's embedded DNS at request
        # time, not once at startup. A static `upstream`/hostname is resolved when
        # nginx loads its config and hard-fails (emerg: host not found) if
        # custodian isn't up yet; deferring resolution lets nginx start on its own
        # and return 502 while custodian boots, rather than crash-looping with it.
        resolver 127.0.0.11 valid=10s ipv6=off;

        # Preserve the viewer's request as CloudFront forwarded it; custodian's
        # auth and same-origin behaviour depend on the original Host and scheme.
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        # The authed admin API: the stricter budget.
        location /admin/ {
            limit_req zone=admin burst=10 nodelay;
            set $upstream http://custodian:8080;
            proxy_pass $upstream;
        }

        # Everything else — the public read surface and /healthz.
        location / {
            limit_req zone=public burst=40 nodelay;
            set $upstream http://custodian:8080;
            proxy_pass $upstream;
        }
    }
}
