# custodian's origin reverse-proxy. TLS terminates at CloudFront; this hop is
# plain HTTP (deed.md:244-245). nginx's only jobs here are to forward to
# custodian and to apply per-location rate limits (custodian.md story 10). It is
# not an internet-facing server: the box's security group admits only the
# CloudFront origin-facing prefix list, so every request already came through the
# edge.

events {}

http {
    # The real client sits behind CloudFront, so $remote_addr is a CloudFront
    # edge, not the caller. CloudFront appends the viewer IP to X-Forwarded-For;
    # take its first hop as the rate-limit key. Falls back to $remote_addr when
    # the header is absent (a direct origin call, which the security group blocks
    # anyway).
    map $http_x_forwarded_for $client_ip {
        default        $remote_addr;
        "~^(?<first>[^,]+)" $first;
    }

    # Two zones: a looser public budget and a tighter one for the admin surface,
    # which is authed and write-heavy. burst/nodelay live on the locations.
    limit_req_zone $client_ip zone=public:10m rate=20r/s;
    limit_req_zone $client_ip zone=admin:10m rate=5r/s;

    # 429, not nginx's default 503, when a caller outruns its budget.
    limit_req_status 429;

    upstream custodian {
        server custodian:8080;
    }

    server {
        listen 80;
        listen [::]:80;

        # Preserve the viewer's request as CloudFront forwarded it; custodian's
        # auth and same-origin behaviour depend on the original Host and scheme.
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        # The authed admin API: the stricter budget.
        location /admin/ {
            limit_req zone=admin burst=10 nodelay;
            proxy_pass http://custodian;
        }

        # Everything else — the public read surface and /healthz.
        location / {
            limit_req zone=public burst=40 nodelay;
            proxy_pass http://custodian;
        }
    }
}
